<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06060a">
<title>Hary's Zombie Survivor</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #06060a; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 240px 60px rgba(0,0,0,0.85); }
  .ui { position: absolute; pointer-events: none; user-select: none; text-shadow: 0 2px 6px rgba(0,0,0,0.85); }

  /* HUD top-left */
  #hud { top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); font-size: 12px; line-height: 1.5; font-weight: 700; letter-spacing: 1.5px; }
  #hud .lbl { opacity: .75; }
  #hpwrap { width: min(280px, 50vw); height: 16px; border-radius: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18); overflow: hidden; margin-top: 5px; box-shadow: inset 0 0 8px rgba(0,0,0,0.5); }
  #hp { height: 100%; background: linear-gradient(90deg,#ff2828,#ff7070); box-shadow: 0 0 12px rgba(255,40,40,0.5); transition: width .12s; }

  /* Stats top-right */
  #stats { top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); font-size: 12px; line-height: 1.7; font-weight: 700; letter-spacing: 1.5px; text-align: right; }
  #stats .lbl { opacity: .75; }
  #stats b { color: #ff6060; font-size: 22px; text-shadow: 0 0 10px rgba(255,40,40,0.5); }

  /* Death overlay */
  #center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(3px); background: rgba(0,0,0,0.55); padding: 20px; }
  #center.hidden { display: none; }
  #center .panel { background: rgba(10,4,8,0.88); padding: 28px 36px; border-radius: 18px; border: 1px solid rgba(255,80,80,0.25); box-shadow: 0 0 60px rgba(120,10,10,0.4); text-align: center; max-width: 90vw; }
  #center h1 { margin: 0 0 12px; font-size: clamp(40px, 9vw, 64px); letter-spacing: 4px; color: #ff2828; text-shadow: 0 0 28px rgba(255,30,30,0.75); }
  #center p { margin: 8px 0; font-size: clamp(15px, 4vw, 18px); opacity: .92; }
  #center p b { color: #ff8080; font-size: clamp(18px, 5vw, 22px); }
  #center button { margin-top: 22px; padding: 16px 42px; font-size: 20px; font-weight: bold; letter-spacing: 2px; background: linear-gradient(180deg, #ff4040, #b81818); color: #fff; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 24px rgba(255,30,30,.45), inset 0 1px 0 rgba(255,200,200,0.3); }
  #center button:active { transform: translateY(1px); }

  /* Footer hint */
  #footer { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 11px; opacity: .5; letter-spacing: 1.5px; pointer-events: none; }
  #footer .key { background: rgba(255,80,80,0.12); padding: 1px 7px; border-radius: 5px; color: #ff9090; }

  /* Virtual joystick (mobile) */
  #joy {
    position: absolute;
    bottom: calc(max(20px, env(safe-area-inset-bottom)) + 10px);
    left: calc(max(20px, env(safe-area-inset-left)) + 10px);
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.5);
    pointer-events: auto;
    touch-action: none;
    display: none;
  }
  #joy.show { display: block; }
  #joyKnob {
    position: absolute;
    top: 50%; left: 50%;
    width: 56px; height: 56px;
    margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff7878, #b82828);
    border: 2px solid rgba(255,255,255,0.4);
    box-shadow: 0 0 18px rgba(255,40,40,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
    pointer-events: none;
    transition: transform .08s ease-out;
  }
  #joy.active #joyKnob { transition: none; }

  /* Show joystick on coarse-pointer (touch) devices, hide footer keys */
  @media (pointer: coarse) {
    #joy { display: block; }
    #footer .key { display: none; }
    #footer { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="hud" class="ui">
  <div class="lbl">HP</div>
  <div id="hpwrap"><div id="hp" style="width:100%"></div></div>
</div>
<div id="stats" class="ui">
  <div><span class="lbl">KILLS</span> <b id="kills">0</b></div>
  <div><span class="lbl">TIME</span>  <b id="time">0:00</b></div>
</div>

<div id="joy"><div id="joyKnob"></div></div>

<div id="center" class="hidden">
  <div class="panel">
    <h1>YOU DIED</h1>
    <p>Kills: <b id="finalKills">0</b></p>
    <p>Time survived: <b id="finalTime">0:00</b></p>
    <button id="restart">RESTART</button>
  </div>
</div>

<div id="footer">
  <span class="key">WASD</span> to move &nbsp;·&nbsp; weapon fires automatically &nbsp;·&nbsp; <span class="key">R</span> to restart
</div>

<script>
(() => {
  'use strict';

  // ---- Canvas + DPR ----
  const cv  = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();

  // ---- Input: keyboard ----
  const keys = new Set();
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys.add(k);
    if (k === 'r' && state.dead) restart();
  });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

  // ---- Input: virtual joystick ----
  const joy = { el: document.getElementById('joy'), knob: document.getElementById('joyKnob'),
                active: false, pid: null, cx: 0, cy: 0, dx: 0, dy: 0, max: 50 };

  function joyStart(e) {
    const t = e.touches ? e.touches[0] : e;
    const r = joy.el.getBoundingClientRect();
    joy.cx = r.left + r.width / 2;
    joy.cy = r.top + r.height / 2;
    joy.active = true;
    joy.pid = e.pointerId ?? (e.touches ? e.touches[0].identifier : null);
    joy.el.classList.add('active');
    joyMove(e);
  }
  function joyMove(e) {
    if (!joy.active) return;
    let cx, cy;
    if (e.touches) {
      let t = null;
      for (const tt of e.touches) if (tt.identifier === joy.pid) { t = tt; break; }
      if (!t) t = e.touches[0];
      cx = t.clientX; cy = t.clientY;
    } else {
      cx = e.clientX; cy = e.clientY;
    }
    let dx = cx - joy.cx, dy = cy - joy.cy;
    const d = Math.hypot(dx, dy);
    if (d > joy.max) { dx = dx / d * joy.max; dy = dy / d * joy.max; }
    joy.dx = dx; joy.dy = dy;
    joy.knob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function joyEnd(e) {
    if (!joy.active) return;
    joy.active = false;
    joy.dx = 0; joy.dy = 0;
    joy.el.classList.remove('active');
    joy.knob.style.transform = 'translate(0,0)';
  }
  joy.el.addEventListener('pointerdown', e => { joy.el.setPointerCapture?.(e.pointerId); joyStart(e); e.preventDefault(); });
  joy.el.addEventListener('pointermove', e => { if (joy.active) { joyMove(e); e.preventDefault(); } });
  joy.el.addEventListener('pointerup',     joyEnd);
  joy.el.addEventListener('pointercancel', joyEnd);
  // Touch fallbacks for older mobile browsers
  joy.el.addEventListener('touchstart',  e => { joyStart(e); e.preventDefault(); }, { passive: false });
  joy.el.addEventListener('touchmove',   e => { joyMove(e);  e.preventDefault(); }, { passive: false });
  joy.el.addEventListener('touchend',    joyEnd);
  joy.el.addEventListener('touchcancel', joyEnd);

  // Show joystick on touch devices
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    joy.el.classList.add('show');
  }

  // ---- Tuning ----
  const PLAYER_SPEED   = 220;
  const PLAYER_R       = 14;
  const PLAYER_HP      = 100;
  const CONTACT_DMG    = 12;
  const IFRAME_TIME    = 0.55;

  const FIRE_INTERVAL  = 0.4;
  const BULLET_SPEED   = 720;
  const BULLET_LIFE    = 1.0;
  const BULLET_DMG     = 1;

  const ZOMBIE_R       = 13;
  const ZOMBIE_HP      = 1;
  const ZOMBIE_SPD_MIN = 60;
  const ZOMBIE_SPD_MAX = 95;

  const SPAWN_START    = 1.10;
  const SPAWN_MIN      = 0.18;
  const SPAWN_RAMP_T   = 300;
  const SPAWN_CAP      = 220;

  // ---- State ----
  const state = {
    player: null, zombies: [], bullets: [],
    time: 0, kills: 0, dead: false,
    spawnTimer: 0, fireTimer: 0, iframes: 0,
  };

  function restart() {
    state.player = { x: 0, y: 0, hp: PLAYER_HP };
    state.zombies.length = 0;
    state.bullets.length = 0;
    state.time = 0;
    state.kills = 0;
    state.dead = false;
    state.spawnTimer = 0;
    state.fireTimer = 0;
    state.iframes = 0;
    document.getElementById('center').classList.add('hidden');
    last = performance.now();
  }

  function spawnZombie() {
    if (state.zombies.length >= SPAWN_CAP) return;
    const margin = 40;
    const halfW = W / 2 + margin;
    const halfH = H / 2 + margin;
    const p = state.player;
    const side = (Math.random() * 4) | 0;
    let x, y;
    if (side === 0)      { x = p.x - halfW; y = p.y + (Math.random() * 2 - 1) * halfH; }
    else if (side === 1) { x = p.x + halfW; y = p.y + (Math.random() * 2 - 1) * halfH; }
    else if (side === 2) { y = p.y - halfH; x = p.x + (Math.random() * 2 - 1) * halfW; }
    else                 { y = p.y + halfH; x = p.x + (Math.random() * 2 - 1) * halfW; }
    const speed = ZOMBIE_SPD_MIN + Math.random() * (ZOMBIE_SPD_MAX - ZOMBIE_SPD_MIN);
    state.zombies.push({ x, y, hp: ZOMBIE_HP, speed });
  }

  function nearestZombie() {
    const p = state.player;
    let best = null, bd = Infinity;
    for (const z of state.zombies) {
      const dx = z.x - p.x, dy = z.y - p.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = z; }
    }
    return best;
  }

  function fire() {
    const target = nearestZombie();
    if (!target) return;
    const p = state.player;
    const dx = target.x - p.x, dy = target.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    state.bullets.push({
      x: p.x, y: p.y,
      vx: dx / d * BULLET_SPEED,
      vy: dy / d * BULLET_SPEED,
      life: BULLET_LIFE,
    });
  }

  function die() {
    state.dead = true;
    document.getElementById('finalKills').textContent = state.kills;
    document.getElementById('finalTime').textContent  = formatTime(state.time);
    document.getElementById('center').classList.remove('hidden');
  }

  function formatTime(t) {
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ---- Update ----
  function update(dt) {
    if (state.dead) return;
    state.time += dt;

    // Movement: combine keyboard + joystick
    const p = state.player;
    let mx = 0, my = 0;
    if (keys.has('w') || keys.has('arrowup'))    my -= 1;
    if (keys.has('s') || keys.has('arrowdown'))  my += 1;
    if (keys.has('a') || keys.has('arrowleft'))  mx -= 1;
    if (keys.has('d') || keys.has('arrowright')) mx += 1;
    if (joy.active) {
      mx += joy.dx / joy.max;
      my += joy.dy / joy.max;
    }
    if (mx || my) {
      const m = Math.hypot(mx, my);
      const n = m > 1 ? 1 / m : 1;        // normalize if combined > 1
      const speedScale = Math.min(m, 1);  // joystick analog magnitude
      p.x += (mx * n) * PLAYER_SPEED * speedScale * dt;
      p.y += (my * n) * PLAYER_SPEED * speedScale * dt;
    }

    // Spawn ramp
    const t = Math.min(state.time / SPAWN_RAMP_T, 1);
    const interval = SPAWN_START + (SPAWN_MIN - SPAWN_START) * t;
    state.spawnTimer += dt;
    while (state.spawnTimer >= interval) { state.spawnTimer -= interval; spawnZombie(); }

    // Auto-fire
    state.fireTimer += dt;
    while (state.fireTimer >= FIRE_INTERVAL) { state.fireTimer -= FIRE_INTERVAL; fire(); }

    // Bullets
    for (const b of state.bullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
    }

    // Zombies move + contact damage
    if (state.iframes > 0) state.iframes -= dt;
    for (const z of state.zombies) {
      const dx = p.x - z.x, dy = p.y - z.y;
      const d = Math.hypot(dx, dy) || 1;
      z.x += (dx / d) * z.speed * dt;
      z.y += (dy / d) * z.speed * dt;
      if (state.iframes <= 0 && d < ZOMBIE_R + PLAYER_R) {
        p.hp -= CONTACT_DMG;
        state.iframes = IFRAME_TIME;
        if (p.hp <= 0) { p.hp = 0; die(); break; }
      }
    }

    // Bullet vs zombie
    for (const b of state.bullets) {
      if (b.life <= 0) continue;
      for (const z of state.zombies) {
        if (z.hp <= 0) continue;
        const dx = z.x - b.x, dy = z.y - b.y;
        const r = ZOMBIE_R + 4;
        if (dx * dx + dy * dy < r * r) {
          z.hp -= BULLET_DMG;
          b.life = 0;
          if (z.hp <= 0) state.kills++;
          break;
        }
      }
    }

    if (state.bullets.length) state.bullets = state.bullets.filter(b => b.life > 0);
    if (state.zombies.length) state.zombies = state.zombies.filter(z => z.hp > 0);

    document.getElementById('hp').style.width = (p.hp / PLAYER_HP * 100) + '%';
    document.getElementById('kills').textContent = state.kills;
    document.getElementById('time').textContent  = formatTime(state.time);
  }

  // ---- Render ----
  function draw() {
    const p = state.player;
    ctx.fillStyle = '#06060a';
    ctx.fillRect(0, 0, W, H);

    const ox = W / 2 - p.x;
    const oy = H / 2 - p.y;

    // Grid background
    const grid = 64;
    ctx.strokeStyle = '#15151f';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const startX = Math.floor((p.x - W / 2) / grid) * grid;
    for (let x = startX; x <= startX + W + grid; x += grid) {
      ctx.moveTo(x + ox, 0); ctx.lineTo(x + ox, H);
    }
    const startY = Math.floor((p.y - H / 2) / grid) * grid;
    for (let y = startY; y <= startY + H + grid; y += grid) {
      ctx.moveTo(0, y + oy); ctx.lineTo(W, y + oy);
    }
    ctx.stroke();

    // Bullets
    for (const b of state.bullets) {
      const x = b.x + ox, y = b.y + oy;
      ctx.fillStyle = 'rgba(255,240,140,0.35)';
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fffacc';
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill();
    }

    // Zombies
    for (const z of state.zombies) {
      const x = z.x + ox, y = z.y + oy;
      ctx.fillStyle = '#3d5a32';
      ctx.beginPath(); ctx.arc(x, y, ZOMBIE_R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1c2918';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#ff2424';
      ctx.beginPath();
      ctx.arc(x - 4, y - 3, 1.8, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 3, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Player
    {
      const x = W / 2, y = H / 2;
      const flicker = state.iframes > 0 && (Math.floor(state.time * 22) % 2) === 0;
      ctx.fillStyle = flicker ? '#ffffff' : '#5fd97a';
      ctx.beginPath(); ctx.arc(x, y, PLAYER_R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1c3a22';
      ctx.lineWidth = 2;
      ctx.stroke();
      const nz = nearestZombie();
      if (nz) {
        const dx = nz.x - p.x, dy = nz.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        ctx.fillStyle = '#fffacc';
        ctx.beginPath();
        ctx.arc(x + dx / d * (PLAYER_R + 4), y + dy / d * (PLAYER_R + 4), 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- Loop ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('restart').addEventListener('click', restart);
  restart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
